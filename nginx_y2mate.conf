# Nginx configuration snippet for YouTube-Downloader (y2-mate.online)
# Place in /etc/nginx/sites-available/y2-mate.online or include in server block.

server {
    listen 80;
    server_name y2-mate.online www.y2-mate.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name y2-mate.online www.y2-mate.online;

    # SSL certificates (configured via Certbot/Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/y2-mate.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/y2-mate.online/privkey.pem;

    client_max_body_size 100M;

    # Static files served directly by Nginx (or fallback to WhiteNoise)
    location /static/ {
        alias /var/www/YouTube-Downloader/static_serve/static_root/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /var/www/YouTube-Downloader/static_serve/media_root/;
        expires 7d;
        access_log off;
    }

    # Video/Audio download & conversion endpoints (long timeouts to eliminate 502 Bad Gateway)
    location ~ ^/(download-stream|convert-mp3)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extended timeouts for video downloading and FFmpeg audio conversion
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Disable buffering so media chunks stream directly to client
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Django application proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Resilient proxy timeouts
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Retry on transient upstream failure before returning 502
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
